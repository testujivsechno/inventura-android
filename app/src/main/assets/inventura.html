async function ctStart(id){if(!ct)return;const my=++ct.gen;ctStop();ct.id=id;ctChips();ctSay('Spouštím kameru…');

  try{const caps=tr.getCapabilities?tr.getCapabilities():{};if(caps.focusMode&&caps.focusMode.includes('continuous'))await tr.applyConstraints({focusMode:'continuous'})}catch(e){}
  const vd=ct.vid;vd.srcObject=s;await vd.play();await frameReady(vd,1500);if(!ct||my!==ct.gen)return;

   if(vd.videoWidth){const k=Math.min(1,1280/vd.videoWidth);c.width=Math.round(vd.videoWidth*k);c.height=Math.round(vd.videoHeight*k);x.drawImage(vd,0,0,c.width,c.height);

 try{let u='';

  const p=supported?await navigator.storage.persisted():null;
  e2.textContent=(p===true?'Trvalé úložiště: ochrana aktivní':p===false?'Trvalé úložiště: ochrana prohlížeče není aktivní':'Data se ukládají do interního úložiště aplikace; samostatné přepnutí ochrany WebView není dostupné.')+u;
  if(supported&&p===false){const b=document.createElement('button');b.className='btn';b.style.marginTop='8px';b.type='button';b.textContent='Požádat o ochranu úložiště';b.onclick=askPersist;e2.appendChild(document.createElement('br'));e2.appendChild(b)}
